server:
  port: 8085

spring:
  application:
    name: lost-found-service
  datasource:
    url: jdbc:mysql://localhost:3306/campus_lostfound?useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: 20041015
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
