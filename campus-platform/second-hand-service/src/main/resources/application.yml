1server:
  port: 8086

spring:
  application:
    name: second-hand-service
  datasource:
    url: jdbc:mysql://localhost:3306/campus_secondhand?useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: 20041015
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
    sentinel:
      transport:
        dashboard: localhost:8081
      eager: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
