services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 20041015
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campus-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: campus-nacos
    environment:
      - MODE=standalone
    ports:
      - "8848:8848"
    restart: unless-stopped

  user-service:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: user-service/target/user-service-1.0.0.jar
    container_name: campus-user
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/campus_user?useUnicode=true&serverTimezone=Asia/Shanghai
      - spring.data.redis.host=redis
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - redis
      - nacos

  news-service:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: campus-news-service/target/campus-news-service-1.0.0.jar
    container_name: campus-news
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/campus_news?useUnicode=true&serverTimezone=Asia/Shanghai
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - nacos

  forum-service:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: forum-service/target/forum-service-1.0.0.jar
    container_name: campus-forum
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/campus_forum?useUnicode=true&serverTimezone=Asia/Shanghai
      - spring.data.redis.host=redis
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - redis
      - nacos

  lostfound-service:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: lost-found-service/target/lost-found-service-1.0.0.jar
    container_name: campus-lostfound
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/campus_lostfound?useUnicode=true&serverTimezone=Asia/Shanghai
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8085:8085"
    depends_on:
      - mysql
      - nacos

  secondhand-service:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: second-hand-service/target/second-hand-service-1.0.0.jar
    container_name: campus-secondhand
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/campus_secondhand?useUnicode=true&serverTimezone=Asia/Shanghai
      - spring.data.redis.host=redis
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8086:8086"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mysql
      - redis
      - nacos

  complaint-service:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: complaint-service/target/complaint-service-1.0.0.jar
    container_name: campus-complaint
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/campus_complaint?useUnicode=true&serverTimezone=Asia/Shanghai
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8087:8087"
    depends_on:
      - mysql
      - nacos

  gateway:
    build:
      context: ../campus-platform
      dockerfile: ../docker-local/Dockerfile
      args:
        JAR_PATH: campus-gateway/target/campus-gateway-1.0.0.jar
    container_name: campus-gateway
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - news-service
      - forum-service

  nginx:
    image: nginx:alpine
    container_name: campus-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../campus-platform/campus-frontend/dist:/usr/share/nginx/html
    depends_on:
      - gateway

volumes:
  mysql_data:
  uploads_data:
